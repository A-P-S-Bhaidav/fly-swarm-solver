[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-swarm-solver"
version = "1.0.0"
description = "Swarm CAPTCHA-Breaker using the MaleCNS v1.0 Drosophila melanogaster connectome"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Anant Pratap Singh Bhaidav" }
]
requires-python = ">=3.10"
dependencies = [
    "flybrain>=0.1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "psutil>=5.9",
    "requests>=2.31",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flyswarm*", "server*", "eval*", "harvest*", "setup*"]
